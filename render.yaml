services:
  - type: web
    name: pakdasht-inspection-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: false
      - key: ALLOW_REGISTRATION
        value: false
      - key: TRUST_PROXY
        value: true
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_TTL_DAYS
        value: 7
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 120
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: MAX_BODY_BYTES
        value: 1000000
