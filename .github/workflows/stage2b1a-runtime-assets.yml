name: Stage 2B.1A Runtime Assets

on:
  push:
    branches:
      - stage2b1a-runtime-assets-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Stage 2B.1A runtime and assets
        run: bash stage2b1a-reel-runtime/verify-runtime-assets.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2b1a-runtime-asset-evidence
          path: stage2b1a-evidence
          if-no-files-found: warn
          retention-days: 1
