name: controlled-production-implementation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor == 'kouroshfaraji1390-creator' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch production implementation
        run: node scripts/patch-production.mjs
      - name: Syntax checks
        run: |
          node --check api/server.mjs
          node --check web/app.js
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff checks
        run: git diff --check
      - name: Commit and push implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/server.mjs web/app.js database/schema.sql database/postgresql-schema.sql dist
          git diff --cached --quiet && { echo 'No implementation diff'; exit 1; }
          git commit -m 'Implement chamber roles, supervision map, and inspection workflows'
          git push origin main
      - name: Remove temporary patch machinery
        run: |
          git rm -f scripts/patch-production.mjs .github/workflows/patch-production.yml
          git commit -m 'chore: remove temporary implementation runner'
          git push origin main
